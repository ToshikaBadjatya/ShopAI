planning_task:
  description: >
    Fetch the current weather for {location} using the weather_by_location tool.
    Create a comprehensive shopping plan for: {shopping_request}
    Consider the user's gender, body type, and any stated preferences.
    Use the weather to suggest appropriate clothing and accessories.
  expected_output: >
   Return a list of json for outfit suggestions based on the shopping request.
  agent: planning_agent

recommendation_task:
  description: >
    Based on the shopping plan, use the outfit_product_scraper tool for each
    outfit piece to fetch 5 bestseller product links from Amazon, Flipkart,
    Myntra, and Meesho. Research and recommend specific products for
    {shopping_request}. Compare options by price, quality, and fit with user
    preferences. Stay within the budget of {budget}.
  expected_output: >
    A ranked list of product recommendations with marketplace links, rationale,
    pros and cons, and estimated prices
  agent: recommendation_agent

marketplace_task:
  description: >
    TODO: define marketplace task description for {shopping_request}
    (placeholder — pairs with the stub marketplace_agent).
  expected_output: >
    TODO: define expected output.
  agent: marketplace_agent

visualize_task:
  description: >
    Transform the shopping plan and product recommendations into a polished
    visual report for {shopping_request}. Use markdown tables, clear sections,
    and an easy-to-scan layout that highlights the best options.

    Additionally, call the outfit_visualizer tool ONCE with:
      - product_url: the FIRST product URL found in the recommendation agent output
      - outfit_description: a concise plain-text summary of the full outfit
      - gender: {gender}
      - height: {height}
      - body_type: {body_type}

    The tool will generate a 1024x1024 model image dressed in the outfit and
    return the saved file path. Embed the image in the markdown report directly
    after the outfit summary section using standard markdown image syntax:
    ![Outfit Visualization](<path returned by tool>)
  expected_output: >
    A beautifully formatted markdown shopping guide with comparison tables,
    a prioritized shortlist, a final summary, and an embedded outfit
    visualization image. Formatted as markdown without '```'
  agent: visualize_agent

master_recommendation_task:
  description: >
    Deliver reviewed outfit recommendations for {shopping_request}.
    The user is {gender}, height {height}, body type {body_type}, style
    preference {style}, shopping in {location} with a budget of {budget}.
    Direct the specialists: have the recommendation specialist curate options,
    have the reviewer judge them against fit, occasion and budget, and send work
    back for another pass when the reviewer's objections are material.

    You are working on run {run_id}. Your ledger tools already write to this
    run - they take no run id, so plan and update steps without naming one.

    This request scored {clarity_tier} on clarity. Present: {clarity_present}.
    Missing: {clarity_missing}.

    Route on that score, and record which path you took in the task ledger:

    - high: run the plan workflow. Delegate curation to the recommendation
      specialist, then critique to the reviewer, then imagery to the visualizer.
    - medium: delegate to the Styling Clarifier. Give it the full conversation
      so far - {conversation_text} - and tell it the tier is medium with these
      dimensions missing: {clarity_missing}.
    - low: delegate to the Styling Clarifier the same way, but tell it the tier
      is low - there is no real request yet, it must not be asked about an
      outfit.

    Either way, the Styling Clarifier answers with exactly one of two shapes:

    - "READY: <request>" - it found enough. Treat the text after "READY: " as
      the finished request and continue exactly as the high path does: curate,
      review, visualize, in this same turn. Do not ask the user anything.
    - "ASK: <question>" - still missing something. Return that question as your
      final answer, verbatim. Do not curate anything yet.

    Never fill in a missing dimension yourself to promote a request to a higher
    tier. A guess recorded as fact is the one failure this routing cannot
    recover from - that is exactly what the Styling Clarifier's tool exists to
    prevent you from needing to do.
  expected_output: >
    Either a JSON object with a "recommendations" array (each entry has
    outfit_name and a products array of {product_name, product_price,
    product_url}), when the plan workflow ran - or a single plain-language
    question, verbatim from the Styling Clarifier's "ASK:" answer, when one
    more turn is needed.

review_recommendation_task:
  description: >
    Review the curated recommendations for {shopping_request} against the user's
    body type ({body_type}), height ({height}), style ({style}), the occasion,
    and the budget of {budget}. Name what is wrong and what should replace it.
    Approve outright when the recommendations already hold up.
  expected_output: >
    A verdict of approved or needs_changes, followed by the specific objections
    and the substitution suggested for each.

clarification_task:
  description: >
    The request "{shopping_request}" scored {clarity_tier} on clarity.
    Dimensions present: {clarity_present}. Dimensions missing: {clarity_missing}.

    If the tier is medium, narrow the request: ask about the single missing
    dimension that would most change what you would recommend.

    If the tier is low, there is not really a request yet. Do not ask about
    the outfit. Find out how this person likes to dress instead.

    Ask one question. Do not answer it yourself, and do not assume what they
    would have said.
  expected_output: >
    A single question for the user, in plain language, with no preamble and no
    list of options unless the options genuinely narrow the choice.
