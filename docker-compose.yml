services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    # Keys (Supabase, Mem0, Arize, HF_TOKEN...) come from your .env at runtime.
    env_file: .env
    environment:
      # `localhost` inside a container is the container itself, so the LLM
      # gateway / Ollama on your machine is reached through the host alias.
      # Ollama: DOCKER_LLM_BASE_URL=http://host.docker.internal:11434/v1
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:3001/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - outputs:/app/src/shopai/output
    restart: unless-stopped

volumes:
  outputs:
